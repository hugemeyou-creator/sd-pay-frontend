<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SD Pay Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    .container {
      width: 94%;
      max-width: 900px;
      margin: 20px auto;
    }

    .login {
      max-width: 450px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 22px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    .login h1 {
      margin-top: 0;
      text-align: center;
    }

    .login p {
      text-align: center;
      color: #6b7280;
    }

    input {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      border: none;
      background: #111827;
      color: white;
      padding: 16px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:active {
      opacity: 0.8;
    }

    .login-error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      display: none;
    }

    .header {
      background: #111827;
      color: white;
      padding: 25px;
      border-radius: 22px;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      color: #d1d5db;
    }

    .logout {
      background: #dc2626;
      margin-top: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin: 0 0 15px;
      color: #6b7280;
      font-size: 18px;
    }

    .number {
      font-size: 40px;
      font-weight: bold;
    }

    .transactions {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .transactions h2 {
      margin-top: 0;
      font-size: 28px;
    }

    .transaction {
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 15px;
      background: #fafafa;
    }

    .transaction p {
      margin: 8px 0;
      font-size: 15px;
      word-break: break-word;
    }

    .status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      background: #dcfce7;
      color: #166534;
      font-weight: bold;
      text-transform: capitalize;
    }

    .refresh {
      margin-top: 15px;
    }

    .message {
      text-align: center;
      padding: 25px 10px;
      color: #6b7280;
      font-size: 17px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      word-break: break-word;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    #dashboard {
      display: none;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .number {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div id="loginPage" class="container">

    <div class="login">

      <h1>SD Pay Admin</h1>

      <p>Admin Login</p>

      <input
        type="text"
        id="username"
        placeholder="Admin Username"
        autocomplete="username"
      >

      <input
        type="password"
        id="password"
        placeholder="Admin Password"
        autocomplete="current-password"
      >

      <button onclick="login()">
        Login
      </button>

      <div id="loginError" class="login-error"></div>

    </div>

  </div>


  <!-- DASHBOARD -->

  <div id="dashboard" class="container">

    <div class="header">

      <h1>SD Pay Admin</h1>

      <p>
        Payment Management Dashboard
      </p>

      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

    </div>


    <div class="stats">

      <div class="card">
        <h3>Total Payments</h3>
        <div class="number" id="total">0</div>
      </div>

      <div class="card">
        <h3>Successful</h3>
        <div class="number" id="successful">0</div>
      </div>

      <div class="card">
        <h3>Pending</h3>
        <div class="number" id="pending">0</div>
      </div>

      <div class="card">
        <h3>Failed</h3>
        <div class="number" id="failed">0</div>
      </div>

    </div>


    <div class="transactions">

      <h2>Transactions</h2>

      <div id="message" class="message">
        Loading transactions...
      </div>

      <div id="transactionsList"></div>

      <button
        class="refresh"
        onclick="loadDashboard()"
      >
        Refresh Transactions
      </button>

    </div>

  </div>


  <script>

    // ===============================
    // LIVE BACKEND
    // ===============================

    const API_BASE =
      "https://sd-pay-backend-1.onrender.com";


    // Credentials stay only in memory.
    // They are NOT saved in localStorage.

    let adminAuth = "";


    // ===============================
    // LOGIN
    // ===============================

    async function login() {

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      const loginError =
        document.getElementById("loginError");


      loginError.style.display = "none";


      if (!username || !password) {

        loginError.textContent =
          "Please enter your username and password.";

        loginError.style.display = "block";

        return;
      }


      adminAuth =
        "Basic " +
        btoa(username + ":" + password);


      try {

        const response =
          await fetch(
            API_BASE + "/api/admin/stats",
            {
              method: "GET",
              headers: {
                "Authorization": adminAuth
              },
              cache: "no-store"
            }
          );


        if (response.status === 401) {

          throw new Error(
            "Invalid admin username or password."
          );

        }


        if (!response.ok) {

          throw new Error(
            "Login failed. HTTP " +
            response.status
          );

        }


        const data =
          await response.json();


        if (!data.success) {

          throw new Error(
            "Unable to verify admin account."
          );

        }


        // Hide login

        document.getElementById(
          "loginPage"
        ).style.display = "none";


        // Show dashboard

        document.getElementById(
          "dashboard"
        ).style.display = "block";


        // Clear password field

        document.getElementById(
          "password"
        ).value = "";


        // Load dashboard

        loadDashboard();


      } catch (error) {

        adminAuth = "";

        loginError.textContent =
          error.message;

        loginError.style.display =
          "block";

      }

    }


    // ===============================
    // LOAD DASHBOARD
    // ===============================

    async function loadDashboard() {

      const message =
        document.getElementById("message");

      const transactionsList =
        document.getElementById(
          "transactionsList"
        );


      message.className = "message";

      message.innerHTML =
        "Loading transactions...";

      transactionsList.innerHTML = "";


      try {

        // ===============================
        // STATS
        // ===============================

        const statsResponse =
          await fetch(
            API_BASE + "/api/admin/stats",
            {
              method: "GET",
              headers: {
                "Authorization": adminAuth
              },
              cache: "no-store"
            }
          );


        if (statsResponse.status === 401) {

          logout();

          throw new Error(
            "Admin session expired."
          );

        }


        if (!statsResponse.ok) {

          throw new Error(
            "Stats request failed: HTTP " +
            statsResponse.status
          );

        }


        const statsData =
          await statsResponse.json();


        if (!statsData.success) {

          throw new Error(
            "Stats API returned an error."
          );

        }


        const stats =
          statsData.stats;


        document.getElementById(
          "total"
        ).textContent =
          stats.total || 0;


        document.getElementById(
          "successful"
        ).textContent =
          stats.successful || 0;


        document.getElementById(
          "pending"
        ).textContent =
          stats.pending || 0;


        document.getElementById(
          "failed"
        ).textContent =
          stats.failed || 0;


        // ===============================
        // PAYMENTS
        // ===============================

        const paymentsResponse =
          await fetch(
            API_BASE + "/api/admin/payments",
            {
              method: "GET",
              headers: {
                "Authorization": adminAuth
              },
              cache: "no-store"
            }
          );


        if (paymentsResponse.status === 401) {

          logout();

          throw new Error(
            "Admin session expired."
          );

        }


        if (!paymentsResponse.ok) {

          throw new Error(
            "Payments request failed: HTTP " +
            paymentsResponse.status
          );

        }


        const paymentsData =
          await paymentsResponse.json();


        if (!paymentsData.success) {

          throw new Error(
            "Payments API returned an error."
          );

        }


        const payments =
          paymentsData.payments || [];


        if (payments.length === 0) {

          message.className =
            "message";

          message.innerHTML =
            "No transactions found.";

          return;
        }


        message.className =
          "success";

        message.innerHTML =
          "✓ " +
          payments.length +
          " transaction(s) loaded successfully.";


        payments.forEach(
          function(payment) {

            const transaction =
              document.createElement("div");

            transaction.className =
              "transaction";


            const date =
              payment.created_at
                ? new Date(
                    payment.created_at
                  ).toLocaleString()
                : "N/A";


            transaction.innerHTML = `

              <p>
                <strong>Transaction ID:</strong>
                ${escapeHtml(payment.id)}
              </p>

              <p>
                <strong>Reference:</strong>
                ${escapeHtml(payment.tx_ref)}
              </p>

              <p>
                <strong>Flutterwave ID:</strong>
                ${escapeHtml(payment.transaction_id)}
              </p>

              <p>
                <strong>Customer:</strong>
                ${escapeHtml(payment.customer_name)}
              </p>

              <p>
                <strong>Email:</strong>
                ${escapeHtml(payment.customer_email)}
              </p>

              <p>
                <strong>Phone:</strong>
                ${escapeHtml(payment.customer_phone)}
              </p>

              <p>
                <strong>Amount:</strong>
                ₦${escapeHtml(payment.amount)}
              </p>

              <p>
                <strong>Currency:</strong>
                ${escapeHtml(payment.currency)}
              </p>

              <p>
                <strong>Status:</strong>

                <span class="status">
                  ${escapeHtml(payment.status)}
                </span>

              </p>

              <p>
                <strong>Date:</strong>
                ${escapeHtml(date)}
              </p>

            `;


            transactionsList.appendChild(
              transaction
            );

          }
        );


      } catch (error) {

        console.error(error);


        if (!error.message.includes(
          "session expired"
        )) {

          message.className =
            "error";

          message.innerHTML =
            "Unable to load dashboard data.<br><br>" +
            escapeHtml(
              error.message
            );

        }

      }

    }


    // ===============================
    // LOGOUT
    // ===============================

    function logout() {

      adminAuth = "";


      document.getElementById(
        "dashboard"
      ).style.display = "none";


      document.getElementById(
        "loginPage"
      ).style.display = "block";


      document.getElementById(
        "username"
      ).value = "";


      document.getElementById(
        "password"
      ).value = "";


      document.getElementById(
        "transactionsList"
      ).innerHTML = "";


      document.getElementById(
        "message"
      ).innerHTML =
        "Loading transactions...";

    }


    // ===============================
    // SECURITY
    // ===============================

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>

</body>
</html>
