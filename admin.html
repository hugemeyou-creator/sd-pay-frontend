<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SD Pay Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .header {
      background: #111827;
      color: white;
      padding: 30px;
      border-radius: 25px;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: 36px;
    }

    .header p {
      margin: 0 0 25px;
      font-size: 20px;
      color: #d1d5db;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .logout {
      width: 100%;
      background: #ef2029;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: white;
      padding: 28px;
      border-radius: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .stat-card h2 {
      margin: 0 0 25px;
      color: #4b5563;
      font-size: 24px;
    }

    .stat-card p {
      margin: 0;
      font-size: 45px;
      font-weight: bold;
    }

    .section {
      background: white;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .section h2 {
      margin-top: 0;
      font-size: 34px;
    }

    .message {
      padding: 18px;
      border-radius: 18px;
      margin-bottom: 25px;
      font-size: 18px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .search-box {
      width: 100%;
      padding: 17px;
      border: 2px solid #d1d5db;
      border-radius: 15px;
      font-size: 17px;
      margin-bottom: 25px;
      outline: none;
    }

    .search-box:focus {
      border-color: #111827;
    }

    .transaction {
      border: 2px solid #e5e7eb;
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 20px;
      background: #fff;
    }

    .transaction p {
      margin: 12px 0;
      font-size: 18px;
      line-height: 1.45;
      word-break: break-word;
    }

    .transaction strong {
      color: #111827;
    }

    .status {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
    }

    .status-successful {
      background: #dcfce7;
      color: #166534;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-failed {
      background: #fee2e2;
      color: #991b1b;
    }

    .no-results {
      text-align: center;
      padding: 25px;
      color: #6b7280;
      font-size: 18px;
    }

    .refresh {
      width: 100%;
      background: #111827;
      color: white;
      margin-bottom: 25px;
    }

    .login-box {
      max-width: 500px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    .login-box h1 {
      margin-top: 0;
      text-align: center;
    }

    .login-box input {
      width: 100%;
      padding: 16px;
      margin-bottom: 15px;
      border: 2px solid #d1d5db;
      border-radius: 12px;
      font-size: 17px;
    }

    .login-box button {
      width: 100%;
      background: #111827;
      color: white;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .header {
        padding: 25px;
      }

      .header h1 {
        font-size: 34px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      .stat-card {
        padding: 22px;
      }

      .stat-card h2 {
        font-size: 21px;
      }

      .stat-card p {
        font-size: 40px;
      }

      .section {
        padding: 22px;
      }

      .transaction p {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<div id="app"></div>

<script>

  /* =========================
     SD PAY BACKEND
  ========================= */

  const API_URL = "https://sd-pay-backend.onrender.com";


  /* =========================
     LOGIN
  ========================= */

  let username = "";
  let password = "";
  let authHeader = "";

  let allTransactions = [];


  function showLogin() {

    document.getElementById("app").innerHTML = `
      <div class="login-box">

        <h1>SD Pay Admin</h1>

        <p style="text-align:center;color:#6b7280;">
          Secure Admin Login
        </p>

        <input
          type="text"
          id="username"
          placeholder="Admin Username"
          autocomplete="username"
        >

        <input
          type="password"
          id="password"
          placeholder="Admin Password"
          autocomplete="current-password"
        >

        <button onclick="login()">
          Login
        </button>

        <div id="loginMessage" style="margin-top:20px;"></div>

      </div>
    `;
  }


  async function login() {

    username = document.getElementById("username").value.trim();
    password = document.getElementById("password").value;

    if (!username || !password) {

      document.getElementById("loginMessage").innerHTML = `
        <div class="message error">
          Please enter your username and password.
        </div>
      `;

      return;
    }

    authHeader = "Basic " + btoa(username + ":" + password);

    try {

      const response = await fetch(
        API_URL + "/api/admin/stats",
        {
          headers: {
            "Authorization": authHeader
          }
        }
      );

      if (!response.ok) {

        throw new Error("Invalid login details.");

      }

      showDashboard();

      loadStats();

      loadTransactions();

    } catch (error) {

      authHeader = "";

      document.getElementById("loginMessage").innerHTML = `
        <div class="message error">
          ❌ ${error.message}
        </div>
      `;
    }
  }


  /* =========================
     DASHBOARD
  ========================= */

  function showDashboard() {

    document.getElementById("app").innerHTML = `

      <div class="container">

        <div class="header">

          <h1>SD Pay Admin</h1>

          <p>Payment Management Dashboard</p>

          <button class="logout" onclick="logout()">
            Logout
          </button>

        </div>


        <div class="stats">

          <div class="stat-card">
            <h2>Total Payments</h2>
            <p id="totalPayments">0</p>
          </div>

          <div class="stat-card">
            <h2>Successful</h2>
            <p id="successfulPayments">0</p>
          </div>

          <div class="stat-card">
            <h2>Pending</h2>
            <p id="pendingPayments">0</p>
          </div>

          <div class="stat-card">
            <h2>Failed</h2>
            <p id="failedPayments">0</p>
          </div>

        </div>


        <div class="section">

          <h2>Transactions</h2>

          <button class="refresh" onclick="refreshDashboard()">
            🔄 Refresh Transactions
          </button>

          <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="🔎 Search by name, phone, email, reference, ID, status..."
            oninput="searchTransactions()"
          >

          <div id="transactionMessage"></div>

          <div id="transactions">
            Loading transactions...
          </div>

        </div>

      </div>
    `;
  }


  /* =========================
     LOAD STATISTICS
  ========================= */

  async function loadStats() {

    try {

      const response = await fetch(
        API_URL + "/api/admin/stats",
        {
          headers: {
            "Authorization": authHeader
          }
        }
      );

      if (response.status === 401) {
        logout();
        return;
      }

      if (!response.ok) {
        throw new Error("Could not load statistics.");
      }

      const data = await response.json();

      document.getElementById("totalPayments").textContent =
        data.total ?? data.totalPayments ?? 0;

      document.getElementById("successfulPayments").textContent =
        data.successful ?? data.successfulPayments ?? 0;

      document.getElementById("pendingPayments").textContent =
        data.pending ?? data.pendingPayments ?? 0;

      document.getElementById("failedPayments").textContent =
        data.failed ?? data.failedPayments ?? 0;

    } catch (error) {

      console.error(error);

    }
  }


  /* =========================
     LOAD TRANSACTIONS
  ========================= */

  async function loadTransactions() {

    const box = document.getElementById("transactions");

    box.innerHTML = "Loading transactions...";

    try {

      const response = await fetch(
        API_URL + "/api/admin/payments",
        {
          headers: {
            "Authorization": authHeader
          }
        }
      );

      if (response.status === 401) {
        logout();
        return;
      }

      if (!response.ok) {
        throw new Error("Could not load transactions.");
      }

      const data = await response.json();

      /*
        Supports either:
        [ ... ]
        or
        { payments: [ ... ] }
      */

      if (Array.isArray(data)) {
        allTransactions = data;
      } else if (Array.isArray(data.payments)) {
        allTransactions = data.payments;
      } else if (Array.isArray(data.transactions)) {
        allTransactions = data.transactions;
      } else {
        allTransactions = [];
      }

      displayTransactions(allTransactions);

      document.getElementById("transactionMessage").innerHTML = `
        <div class="message success">
          ✓ ${allTransactions.length} transaction(s) loaded successfully.
        </div>
      `;

    } catch (error) {

      box.innerHTML = `
        <div class="message error">
          ❌ ${error.message}
        </div>
      `;

      document.getElementById("transactionMessage").innerHTML = "";
    }
  }


  /* =========================
     DISPLAY TRANSACTIONS
  ========================= */

  function displayTransactions(transactions) {

    const box = document.getElementById("transactions");

    if (!transactions || transactions.length === 0) {

      box.innerHTML = `
        <div class="no-results">
          No transactions found.
        </div>
      `;

      return;
    }


    box.innerHTML = transactions.map(transaction => {

      const id =
        transaction.id ??
        transaction.transaction_id ??
        "-";

      const reference =
        transaction.reference ??
        transaction.tx_ref ??
        transaction.ref ??
        "-";

      const flutterwaveId =
        transaction.flutterwave_id ??
        transaction.flutterwaveId ??
        transaction.flw_id ??
        "-";

      const customer =
        transaction.customer_name ??
        transaction.customer ??
        transaction.name ??
        "-";

      const email =
        transaction.email ??
        "-";

      const phone =
        transaction.phone ??
        transaction.customer_phone ??
        "-";

      const amount =
        transaction.amount ??
        "0";

      const currency =
        transaction.currency ??
        "NGN";

      const status =
        transaction.status ??
        "Unknown";

      const date =
        transaction.created_at ??
        transaction.createdAt ??
        transaction.date ??
        "-";


      let statusClass = "";

      if (String(status).toLowerCase() === "successful") {
        statusClass = "status-successful";
      }

      if (String(status).toLowerCase() === "pending") {
        statusClass = "status-pending";
      }

      if (String(status).toLowerCase() === "failed") {
        statusClass = "status-failed";
      }


      return `

        <div class="transaction">

          <p>
            <strong>Transaction ID:</strong>
            ${escapeHTML(id)}
          </p>

          <p>
            <strong>Reference:</strong>
            ${escapeHTML(reference)}
          </p>

          <p>
            <strong>Flutterwave ID:</strong>
            ${escapeHTML(flutterwaveId)}
          </p>

          <p>
            <strong>Customer:</strong>
            ${escapeHTML(customer)}
          </p>

          <p>
            <strong>Email:</strong><br>
            ${escapeHTML(email)}
          </p>

          <p>
            <strong>Phone:</strong>
            ${escapeHTML(phone)}
          </p>

          <p>
            <strong>Amount:</strong>
            ₦${escapeHTML(amount)}
          </p>

          <p>
            <strong>Currency:</strong>
            ${escapeHTML(currency)}
          </p>

          <p>
            <strong>Status:</strong>

            <span class="status ${statusClass}">
              ${escapeHTML(status)}
            </span>
          </p>

          <p>
            <strong>Date:</strong>
            ${formatDate(date)}
          </p>

        </div>

      `;

    }).join("");
  }


  /* =========================
     SEARCH
  ========================= */

  function searchTransactions() {

    const searchBox =
      document.getElementById("searchInput");

    const search =
      searchBox.value.trim().toLowerCase();


    if (!search) {

      displayTransactions(allTransactions);

      return;
    }


    const filtered =
      allTransactions.filter(transaction => {

        const searchableText = [

          transaction.id,

          transaction.transaction_id,

          transaction.reference,

          transaction.tx_ref,

          transaction.ref,

          transaction.flutterwave_id,

          transaction.flutterwaveId,

          transaction.flw_id,

          transaction.customer_name,

          transaction.customer,

          transaction.name,

          transaction.email,

          transaction.phone,

          transaction.customer_phone,

          transaction.amount,

          transaction.currency,

          transaction.status,

          transaction.created_at,

          transaction.createdAt,

          transaction.date

        ]
        .filter(value => value !== undefined && value !== null)
        .join(" ")
        .toLowerCase();


        return searchableText.includes(search);
      });


    displayTransactions(filtered);


    if (filtered.length === 0) {

      document.getElementById("transactions").innerHTML = `
        <div class="no-results">
          No transaction matches "${escapeHTML(searchBox.value)}".
        </div>
      `;
    }
  }


  /* =========================
     REFRESH
  ========================= */

  async function refreshDashboard() {

    document.getElementById("transactionMessage").innerHTML = `
      <div class="message success">
        🔄 Refreshing transactions...
      </div>
    `;

    await loadStats();

    await loadTransactions();

    const searchInput =
      document.getElementById("searchInput");

    if (searchInput) {
      searchInput.value = "";
    }
  }


  /* =========================
     LOGOUT
  ========================= */

  function logout() {

    username = "";
    password = "";
    authHeader = "";
    allTransactions = [];

    showLogin();
  }


  /* =========================
     FORMAT DATE
  ========================= */

  function formatDate(value) {

    if (!value || value === "-") {
      return "-";
    }

    try {

      const date = new Date(value);

      if (isNaN(date.getTime())) {
        return escapeHTML(value);
      }

      return date.toLocaleString();

    } catch {

      return escapeHTML(value);
    }
  }


  /* =========================
     SECURITY
  ========================= */

  function escapeHTML(value) {

    if (value === undefined || value === null) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =========================
     START
  ========================= */

  showLogin();

</script>

</body>
</html>
