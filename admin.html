<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SD Pay Admin</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 15px;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      color: #d1d5db;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 14px;
      color: #6b7280;
    }

    .number {
      font-size: 25px;
      font-weight: bold;
    }

    .transactions {
      background: white;
      margin-top: 15px;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .transactions h2 {
      margin-top: 0;
    }

    .transaction {
      border: 1px solid #e5e7eb;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .transaction strong {
      display: block;
      margin-bottom: 5px;
    }

    .transaction small {
      color: #6b7280;
      display: block;
      margin-top: 4px;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .failed {
      color: red;
      font-weight: bold;
    }

    .pending {
      color: orange;
      font-weight: bold;
    }

    .empty {
      color: #6b7280;
      text-align: center;
      padding: 25px 5px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>SD Pay Admin</h1>
    <p>Payment Management Dashboard</p>
  </div>

  <div class="cards">

    <div class="card">
      <h3>Total Payments</h3>
      <div class="number" id="totalPayments">0</div>
    </div>

    <div class="card">
      <h3>Successful</h3>
      <div class="number" id="successfulPayments">0</div>
    </div>

    <div class="card">
      <h3>Pending</h3>
      <div class="number" id="pendingPayments">0</div>
    </div>

    <div class="card">
      <h3>Failed</h3>
      <div class="number" id="failedPayments">0</div>
    </div>

  </div>

  <div class="transactions">

    <h2>Transactions</h2>

    <div class="empty" id="transactionList">
      Loading transactions...
    </div>

    <button onclick="loadTransactions()">
      Refresh Transactions
    </button>

  </div>

  <script>

    const BACKEND_URL =
      "https://sd-pay-backend.onrender.com";


    // ===============================
    // LOAD STATISTICS
    // ===============================

    async function loadStats() {

      try {

        const response =
          await fetch(
            BACKEND_URL +
            "/api/admin/stats"
          );

        const data =
          await response.json();


        if (!data.success) {

          throw new Error(
            "Unable to load statistics"
          );

        }


        document.getElementById(
          "totalPayments"
        ).textContent =
          data.stats.total || 0;


        document.getElementById(
          "successfulPayments"
        ).textContent =
          data.stats.successful || 0;


        document.getElementById(
          "pendingPayments"
        ).textContent =
          data.stats.pending || 0;


        document.getElementById(
          "failedPayments"
        ).textContent =
          data.stats.failed || 0;


      } catch (error) {

        console.error(
          "Stats error:",
          error
        );

      }

    }


    // ===============================
    // LOAD TRANSACTIONS
    // ===============================

    async function loadTransactions() {

      const list =
        document.getElementById(
          "transactionList"
        );


      list.innerHTML =
        "Loading transactions...";


      try {

        const response =
          await fetch(
            BACKEND_URL +
            "/api/admin/payments"
          );


        const data =
          await response.json();


        if (!data.success) {

          throw new Error(
            "Unable to load payments"
          );

        }


        if (
          !data.payments ||
          data.payments.length === 0
        ) {

          list.innerHTML =
            "No transactions found.";
