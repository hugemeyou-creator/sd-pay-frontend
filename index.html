<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SD Pay</title>

<style>
*{
    box-sizing:border-box;
}

<input
    type="hidden"
    name="public_key"
    value="FLWPUBK_TEST-3f985711f1d69aad4b55922f2d14e59c-X"
>body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
}

header{
    background:#1765d1;
    color:white;
    text-align:center;
    padding:35px 10px;
    font-size:28px;
}

.container{
    max-width:600px;
    margin:60px auto;
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

h1{
    margin-top:0;
    font-size:40px;
}

input{
    width:100%;
    padding:18px;
    margin:10px 0;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:15px;
}

button{
    width:100%;
    padding:20px;
    margin-top:15px;
    background:#1765d1;
    color:white;
    border:0;
    border-radius:15px;
    font-size:20px;
    font-weight:bold;
}

button:active{
    opacity:.8;
}
</style>
</head>

<body>

<header>
    Simple & Secure Payment
</header>

<div class="container">

<h1>Make Payment</h1>

<form
    method="POST"
    action="https://checkout.flutterwave.com/v3/hosted/pay"
    onsubmit="createReference()"
>

<input
    type="text"
    name="customer[name]"
    placeholder="Full Name"
    required
>

<input
    type="email"
    name="customer[email]"
    placeholder="Email"
    required
>

<input
    type="tel"
    name="customer[phone_number]"
    placeholder="Phone Number"
    required
>

<input
    type="number"
    name="amount"
    placeholder="Amount (NGN)"
    min="1"
    required
>


>

<input
    type="hidden"
    name="tx_ref"
    id="tx_ref"
>

<input
    type="hidden"
    name="currency"
    value="NGN"
>

<input
    type="hidden"
    name="payment_options"
    value="card,banktransfer,ussd"
>

<input
    type="hidden"
    name="redirect_url"
    value="https://hugemeyou-creator.github.io/sd-pay-frontend/"
>

<button type="submit">
    Pay Now
</button>

</form>

</div>

<script>
function createReference(){

    document.getElementById("tx_ref").value =
        "SDPAY-" + Date.now();

}
</script>

</body>
</html>
