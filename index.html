<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SD Pay</title>

<script src="https://checkout.flutterwave.com/v3.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
}

header{
    background:#0b5ed7;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
}

.container{
    max-width:500px;
    margin:25px auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:8px;
    background:#0b5ed7;
    color:white;
    font-size:16px;
    font-weight:bold;
}

button:active{
    opacity:.8;
}

#message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
    <h1>SD Pay</h1>
    <p>Simple & Secure Payment</p>
</header>

<div class="container">

    <div class="card">

        <h2>Make Payment</h2>

        <input
            type="text"
            id="name"
            placeholder="Full Name"
        >

        <input
            type="email"
            id="email"
            placeholder="Email Address"
        >

        <input
            type="tel"
            id="phone"
            placeholder="Phone Number"
            inputmode="numeric"
        >

        <input
            type="number"
            id="amount"
            placeholder="Amount (NGN)"
            min="1"
        >

        <button onclick="makePayment()">
            Pay Now
        </button>

        <div id="message"></div>

    </div>

</div>

<script>

function makePayment(){

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const amount = document.getElementById("amount").value;

    if(!name || !email || !phone || !amount){

        document.getElementById("message").innerText =
            "Please fill in all fields.";

        return;
    }

    FlutterwaveCheckout({

        public_key:"FLWPUBK_TEST-3f985711f1d69aad4b55922f2d14e59c-X",

        tx_ref: "SDPAY-" + Date.now(),

        amount: amount,

        currency: "NGN",

        payment_options: "card,banktransfer,ussd",

        customer: {
            email: email,
            phone_number: phone,
            name: name
        },

        customizations: {
            title: "SD Pay",
            description: "SD Pay Test Payment",
            logo: ""
        },

        callback: function(payment){

            document.getElementById("message").innerText =
                "Payment completed. Reference: " +
                payment.transaction_id;

            console.log(payment);
        },

        onclose: function(){

            document.getElementById("message").innerText =
                "Payment window closed.";
        }

    });
}

</script>

</body>
</html>
