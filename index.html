<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SD Pay</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
}

header{
    background:#1765d1;
    color:white;
    text-align:center;
    padding:30px 10px;
    font-size:28px;
    font-weight:bold;
}

.container{
    max-width:500px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#1765d1;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    background:#1765d1;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
}

button:disabled{
    opacity:.6;
}

#message{
    text-align:center;
    margin:20px 0;
    padding:15px;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
}

.success{
    background:#e8f7ee;
    color:#16803c;
}

.failed{
    background:#fdeaea;
    color:#c62828;
}

.info{
    background:#eef4ff;
    color:#1765d1;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<header>
    Simple & Secure Payment
</header>

<div class="container">

    <div id="message" class="hidden"></div>

    <h1>Make Payment</h1>

    <form id="paymentForm">

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
        >

        <input
            type="tel"
            id="phone"
            placeholder="Phone Number"
            inputmode="numeric"
            required
        >

        <input
            type="number"
            id="amount"
            value="100"
            min="1"
            placeholder="Amount"
            required
        >

        <button type="submit" id="payButton">
            Pay Now
        </button>

    </form>

</div>

<script>

const BACKEND_URL =
    "https://sd-pay-backend.onrender.com/api/pay";

const message =
    document.getElementById("message");

const form =
    document.getElementById("paymentForm");


/* Check payment result after returning from Flutterwave */

const params =
    new URLSearchParams(window.location.search);

const payment =
    params.get("payment");


if(payment === "success"){

    message.className = "success";
    message.textContent =
        "✅ Payment Successful!";

    message.classList.remove("hidden");

}

else if(payment === "failed"){

    message.className = "failed";
    message.textContent =
        "❌ Payment Failed. Please try again.";

    message.classList.remove("hidden");

}


/* Start payment */

form.addEventListener("submit", async function(e){

    e.preventDefault();

    const button =
        document.getElementById("payButton");

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const amount =
        document.getElementById("amount").value;


    button.disabled = true;
    button.textContent = "Processing...";


    try{

        const response =
            await fetch(BACKEND_URL, {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    name:name,
                    email:email,
                    phone:phone,
                    amount:Number(amount)

                })

            });


        const data =
            await response.json();


        console.log("Backend response:", data);


        if(!response.ok){

            throw new Error(
                data.message ||
                "Payment request failed"
            );

        }


        const paymentLink =
            data.link ||
            data.payment_link ||
            data.data?.link ||
            data.data?.data?.link;


        if(paymentLink){

            window.location.href =
                paymentLink;

        }

        else{

            throw new Error(
                data.message ||
                "Payment link was not returned"
            );

        }


    }

    catch(error){

        console.error(error);

        message.className = "failed";

        message.textContent =
            "Payment error: " +
            error.message;

        message.classList.remove("hidden");

        button.disabled = false;

        button.textContent =
            "Pay Now";

    }

});

</script>

</body>
</html>
