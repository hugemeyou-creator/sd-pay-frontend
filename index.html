<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SD Pay - Secure Payments</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#172033;
}

header{
    background:#1765d1;
    color:white;
    text-align:center;
    padding:28px 15px;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.subtitle{
    margin-top:7px;
    font-size:15px;
    opacity:.9;
}

.container{
    max-width:500px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    color:#1765d1;
    margin-top:5px;
}

.description{
    text-align:center;
    color:#667085;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #d0d5dd;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#1765d1;
}

.amount-box{
    position:relative;
}

.currency{
    position:absolute;
    left:15px;
    top:15px;
    font-weight:bold;
    color:#1765d1;
}

.amount-box input{
    padding-left:45px;
}

button{
    width:100%;
    padding:16px;
    margin-top:22px;
    background:#1765d1;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
}

button:active{
    transform:scale(.99);
}

button:disabled{
    opacity:.65;
}

#message{
    text-align:center;
    margin-bottom:20px;
    padding:15px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
}

.success{
    background:#e8f7ee;
    color:#16803c;
}

.failed{
    background:#fdeaea;
    color:#c62828;
}

.info{
    background:#eef4ff;
    color:#1765d1;
}

.hidden{
    display:none;
}

.security{
    text-align:center;
    margin-top:18px;
    color:#667085;
    font-size:13px;
}

footer{
    text-align:center;
    padding:20px;
    color:#667085;
    font-size:13px;
}
</style>
</head>

<body>

<header>
    <div class="logo">SD Pay</div>
    <div class="subtitle">Simple & Secure Payments</div>
</header>

<div class="container">

    <div class="card">

        <div id="message" class="hidden"></div>

        <h1>Make a Payment</h1>

        <p class="description">
            Enter your details below to continue securely.
        </p>

        <form id="paymentForm">

            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="phone">Phone Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                inputmode="numeric"
                autocomplete="tel"
                required
            >

            <label for="amount">Payment Amount</label>

            <div class="amount-box">

                <span class="currency">₦</span>

                <input
                    type="number"
                    id="amount"
                    value="100"
                    min="1"
                    step="1"
                    placeholder="Enter amount"
                    required
                >

            </div>

            <button
                type="submit"
                id="payButton"
            >
                Pay Now
            </button>

        </form>

        <div class="security">
            🔒 Your payment is processed securely through Flutterwave.
        </div>

    </div>

</div>

<footer>
    © 2026 SD Pay. All rights reserved.
</footer>

<script>

const BACKEND_URL =
    "https://sd-pay-backend.onrender.com/api/pay";

const message =
    document.getElementById("message");

const form =
    document.getElementById("paymentForm");

const button =
    document.getElementById("payButton");


/* Check payment result after returning from Flutterwave */

const params =
    new URLSearchParams(window.location.search);

const payment =
    params.get("payment");


if(payment === "success"){

    message.className = "success";

    message.textContent =
        "✅ Payment Successful! Thank you for your payment.";

    message.classList.remove("hidden");

}

else if(payment === "failed"){

    message.className = "failed";

    message.textContent =
        "❌ Payment Failed. Please check your details and try again.";

    message.classList.remove("hidden");

}


/* Start payment */

form.addEventListener("submit", async function(e){

    e.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const amount =
        Number(
            document.getElementById("amount").value
        );


    if(!name || !email || !phone || !amount){

        message.className = "failed";

        message.textContent =
            "Please complete all fields.";

        message.classList.remove("hidden");

        return;
    }


    if(amount < 1){

        message.className = "failed";

        message.textContent =
            "Payment amount must be at least ₦1.";

        message.classList.remove("hidden");

        return;
    }


    button.disabled = true;

    button.textContent =
        "Processing Payment...";

    message.className = "info";

    message.textContent =
        "Please wait. Do not close this page.";

    message.classList.remove("hidden");


    try{

        const response =
            await fetch(BACKEND_URL, {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    name:name,
                    email:email,
                    phone:phone,
                    amount:amount

                })

            });


        const data =
            await response.json();


        console.log(
            "Backend response:",
            data
        );


        if(!response.ok){

            throw new Error(
                data.message ||
                "Payment request failed"
            );

        }


        const paymentLink =
            data.link ||
            data.payment_link ||
            data.data?.link ||
            data.data?.data?.link;


        if(paymentLink){

            window.location.href =
                paymentLink;

        }

        else{

            throw new Error(
                data.message ||
                "Payment link was not returned"
            );

        }


    }

    catch(error){

        console.error(error);

        message.className = "failed";

        message.textContent =
            "Payment error: " +
            error.message;

        message.classList.remove("hidden");

        button.disabled = false;

        button.textContent =
            "Pay Now";

    }

});

</script>

</body>
</html>
